[package]
name = "port-forward"
version = "0.1.0"
edition = "2021"
description = "Port Forward — webhook interceptor + cloudflared tunnel (Tauri v2)"
license = "MIT"
default-run = "port-forward"

[lib]
name = "port_forward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tunnel-core = { workspace = true }
interceptor-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[features]
# this feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# `test` enables `tauri::test` (mock runtime + IPC dispatcher) so the command
# layer can be verified headlessly — see tests/tauri_commands.rs.
tauri = { version = "2", features = ["test"] }
