[package]
name = "tunnel-core"
version = "0.1.0"
edition = "2021"
description = "cloudflared quick-tunnel lifecycle (detect, start, stop) with typed errors. No Tauri/GUI dependencies so it is unit-testable in headless environments."
license = "MIT"

[lib]
name = "tunnel_core"
path = "src/lib.rs"

[dependencies]
regex = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
